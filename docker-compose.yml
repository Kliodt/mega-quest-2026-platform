services:
  mongo:
    # 8.x отказывается стартовать на ядрах Linux 6.19–7.0.13 (баг tcmalloc, SERVER-121912)
    image: mongo:7
    ports:
      - '${MONGO_HOST_PORT:-27018}:27017'
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev -w packages/api
    working_dir: /app
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_URI: mongodb://mongo:27017/quest
      JWT_SECRET: ${JWT_SECRET:-change-me-in-dev-please}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-admin-token}
      API_PORT: 3000
    ports:
      - '${API_HOST_PORT:-3100}:3000'
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - shared_node_modules:/app/packages/shared/node_modules
      - api_node_modules:/app/packages/api/node_modules
      - web_node_modules:/app/packages/web/node_modules
    depends_on:
      - mongo

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev -w packages/web -- --host 0.0.0.0
    working_dir: /app
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
      WEB_PORT: ${WEB_HOST_PORT:-5173}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-false}
      # Заполняются, когда дев-сервер смотрит наружу через туннель (ngrok и подобные)
      WEB_ALLOWED_HOSTS: ${WEB_ALLOWED_HOSTS:-}
      WEB_HMR_CLIENT_PORT: ${WEB_HMR_CLIENT_PORT:-}
      WEB_HMR_PROTOCOL: ${WEB_HMR_PROTOCOL:-}
    ports:
      - '${WEB_HOST_PORT:-5173}:${WEB_HOST_PORT:-5173}'
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - shared_node_modules:/app/packages/shared/node_modules
      - api_node_modules:/app/packages/api/node_modules
      - web_node_modules:/app/packages/web/node_modules
    depends_on:
      - api

  storybook:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run storybook -w packages/web -- --host 0.0.0.0 --port 6006 --no-open --ci
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-false}
    ports:
      - '${STORYBOOK_HOST_PORT:-6006}:6006'
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - shared_node_modules:/app/packages/shared/node_modules
      - api_node_modules:/app/packages/api/node_modules
      - web_node_modules:/app/packages/web/node_modules

volumes:
  mongo_data:
  root_node_modules:
  shared_node_modules:
  api_node_modules:
  web_node_modules:
